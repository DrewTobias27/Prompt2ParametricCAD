[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt2parametriccad"
version = "0.2.0"
description = "Natural-language and guided parametric CAD generation with CadQuery."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Drew Tobias" }]
dependencies = [
    "cadquery==2.7.0",
    "fastapi==0.138.0",
    "jsonschema==4.26.0",
    "openai==2.43.0",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.urls]
Repository = "https://github.com/DrewTobias27/Prompt2ParametricCAD"

[project.scripts]
prompt2cad = "prompt2cad.cli:main"
prompt2cad-eval = "prompt2cad.eval_runner:main"
prompt2cad-feature-tree = "prompt2cad.feature_tree_export:main"
prompt2cad-editable-model = "prompt2cad.editable_model_export:main"
prompt2cad-training-data = "prompt2cad.training_data:main"
prompt2cad-model-matrix = "prompt2cad.model_matrix_eval:main"
prompt2cad-live-eval = "prompt2cad.tiny_api_compare:main"
prompt2cad-showcase = "prompt2cad.showcase:main"
prompt2cad-solidworks = "prompt2cad.solidworks_export:main"
prompt2cad-solidworks-smoke = "prompt2cad.solidworks_smoke:main"
prompt2cad-capability-audit = "prompt2cad.capability_audit:main"
prompt2cad-release-matrix = "prompt2cad.release_matrix:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt2cad = ["solidworks_replay.ps1", "solidworks_replay_runner.cs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
